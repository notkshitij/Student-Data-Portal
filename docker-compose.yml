services:
  postgres:
    image: postgres:17
    container_name: sdvp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sdvp}
      POSTGRES_USER: ${POSTGRES_USER:-sdvp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sdvp_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sdvp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sdvp_user} -d ${POSTGRES_DB:-sdvp}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sdvp_pgdata:
